<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Choose your Own Adventure - SpringAI</title>
    <style>
        body { font-family: Arial, sans-serif; line-height: 1.6; color: #333; }
        .container { max-width: 800px; margin: 0 auto; padding-top: 20px; }
        .form-group { margin-bottom: 15px; }
        label { font-weight: bold; display: block; margin-bottom: 5px; }
        input[type="text"], input[type="number"] { width: 100%; padding: 8px; border-radius: 4px; border: 1px solid #ddd; }
        button { padding: 10px 15px; background-color: #4CAF50; color: white; border: none; border-radius: 4px; cursor: pointer; }
        .response { margin-top: 30px; padding: 20px; background-color: #f9f9f9; border: 1px solid #ddd; border-radius: 4px; }
        .response h3 { color: #4CAF50; font-size: 1.5em; }
        .adventure-list { margin-top: 15px; }
        .adventure-list li { margin-bottom: 10px; }
        .adventure-title { font-weight: bold; color: #333; }
    </style>

    <script type="text/javascript">

        function buttonCheck() {
            if (document.getElementById('textCheck').checked) {
                document.getElementById('ifText').style.display = 'block';

                document.getElementById('ifImage').style.display = 'none';
                document.getElementById('ifAudio').style.display = 'none';

            }

            if (document.getElementById('audioCheck').checked) {
                document.getElementById('ifAudio').style.display = 'block';

                document.getElementById('ifText').style.display = 'none';
                document.getElementById('ifImage').style.display = 'none';
            }

            if (document.getElementById('imageCheck').checked) {
                document.getElementById('ifImage').style.display = 'block';

                document.getElementById('ifText').style.display = 'none';
                document.getElementById('ifAudio').style.display = 'none';
            }

        }
    </script>

</head>
<body>
<div class="container">
    <h2>Choose your Own Adventure! With SpringAI</h2>
    <!--<div th:if="${!showForm}">-->
        <form action="#" th:action="@{/chat/start}" th:method="post">
            <div class="form-group">
                <label for="genre">Enter a Genre:</label>
                <input type="text" id="genre" name="genre" placeholder="E.g., Fantasy, Action, Drama, Thriller..." required>
            </div>
            <div class="form-group">
                <label for="numCharacters">Number of Characters:</label>
                <input type="number" id="numCharacters" name="numCharacters" min="1" placeholder="E.g., 5" required>
            </div>

            <div class="form-group">
                <label for="nameDescription">Name and Description of Main Character:</label>
                <input type="text" id="nameDescription" name="nameDescription" placeholder="Frodo, has curly brown hair and wears brown clothing."required>
            </div>

            <!--
          <div class="form-group">
              <label>Name and Description of Main Character</label>
              Text <input type="radio" onclick="javascript:buttonCheck();" name="yesno" id="textCheck">
              Audio <input type="radio" onclick="javascript:buttonCheck();" name="yesno" id="audioCheck">
              Image <input type="radio" onclick="javascript:buttonCheck();" name="yesno" id="imageCheck"><br>


              <!div id="ifText" style="display:none">
                  <label for="text">Enter character name and description: </label>
                  <textarea id="text" name="text" placeholder="Frodo, has curly brown hair and wears brown clothing..."></textarea><br>
              </div>
              <div id="ifAudio" style="display:none">
                  <label for="audio">Upload audio file:</label>
                  <input type="file" id="audio" name="audio" accept="audio/*"><br>
              </div>
              <div id="ifImage" style="display:none">
                  <label for="image">Upload image:</label>
                  <input type="file" id="image" name="image" accept="image/*"><br>
              </div>
              -->

            <br>

            <div class="form-group">
                <label for="choices">Length of Adventure (in decisions):</label>
                <input type="text" id="choices" name="choices" placeholder="E.g., 5 decisions, 10 decisions, 15 decisions..." required>
            </div>
            <div class="form-group">
                <label for="complexity">Complexity of Adventure:</label>
                <input type="text" id="complexity" name="complexity" placeholder="E.g., High, Medium, Low" required>
            </div>
            <div class="form-group">
                <label for="location">Location of Adventure:</label>
                <input type="text" id="location" name="location" placeholder="It could be anywhere!" required>
            </div>
            <button type="submit">Start story</button>
        </form>
    <!--</div>-->

    <!--
    <div class="response" th:if="${response}" style="max-width: 600px; margin: 20px auto; padding: 20px; background-color: #e7f3fe; border: 1px solid #b3d7ff; border-radius: 8px;">
        <h2 style="color: #333;">Response:</h2>
        <p th:text="${response}" style="color: #333;">Chat assistant response will appear here.</p>
    </div>
    -->


    <!--
    <div>
        <p th:text="${story}"></p>
        <form>
            <div th:each="choice: ${choicesResponse}">
                <input type="radio" th:value="${choice}" th:text="${choice}" name="choice"/>
            </div>
            <button type="submit">Send</button>
        </form>
    </div>
    -->
</div>
<div class="container">
    <div th:if="${storyStarted}">
        <div class="response" th:if="${response}" style="max-width: 600px; margin: 20px auto; padding: 20px; background-color: #e7f3fe; border: 1px solid #b3d7ff; border-radius: 8px;">
            <h2 style="color: #333;">Response:</h2>
            <p th:text="${story}"></p>

            <form th:if="${!storyEnded}" action="/chat/progress" method="post">
                <div th:each="choice: ${choicesResponse}">
                    <input type="radio" th:value="${choice}" th:text="${choice}" name="choice"/>
                </div>
                <!--<img src="{image}" title="image" alt="Initial story image" width="300" height="200" style="border: 2px solid black;">-->
                <button type="submit">Send</button>
            </form>
        </div>

        <div class="progressResponse" th:if="${progressResponse}" style="max-width: 600px; margin: 20px auto; padding: 20px; background-color: #e7f3fe; border: 1px solid #b3d7ff; border-radius: 8px;">
            <h2 style="color: #333;">Response:</h2>
            <p th:text="${story}"></p>
            <p th:text="${complexityLeft}"></p>
            <p style="color: #333;"><strong>Last choice:</strong></p><p th:text="${lastChoice}"></p>
            <p style="color: #333;"><strong>Choices:</strong></p><p th:text="${choicesNumber}"></p>
            <form action="/chat/progress" method="post">
                <div th:each="choice: ${choicesResponse}">
                    <input type="radio" th:value="${choice}" th:text="${choice}" name="choice"/>
                </div>
                <div th:if="${!storyEnded}">
                    <button type="submit">Send</button>
                </div>

                <div th:if="${storyEnded}">
                    <form action="/chat/ending" method="post">
                        <p style="color: #333;"><strong>Ending:</strong></p>
                        <p th:text="${endingResponse}"></p>
                        <img src="/images/cat-thumbsup.png" title="ending-image" width="300" height="200" style="border: 2px solid black;">
                    </form>
                </div>
            </form>
        </div>
    </div>
</div>
</body>
</html>
